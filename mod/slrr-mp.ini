; SLRR-MP bridge settings, read at game start
[mp]
; UDP port of SlrrMp on 127.0.0.1, must match BridgePort in SlrrMp.json
bridge_port=27651
; remote cars are drawn this far in the past so there is always a sample to interpolate to
interp_delay_ms=100
; remove a remote car after this long without data
timeout_ms=3000
; script loop sleep
tick_ms=10
